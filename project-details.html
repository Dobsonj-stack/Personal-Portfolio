<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details | Josh Dobson</title>
    <meta
      name="description"
      content="Detailed project information including overview, technologies, and outcomes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-gradient"></div>

    <header class="site-header" id="top">
      <nav class="nav container">
        <a class="brand" href="index.html#top">Josh Dobson<span>.</span></a>
        <a class="btn btn-secondary" href="index.html#projects">← Back to Projects</a>
      </nav>
    </header>

    <main class="section container">
      <article class="project-detail-card">
        <p class="eyebrow" id="project-category">Project</p>
        <h1 id="project-title">Project details</h1>
        <p class="hero-text" id="project-summary"></p>

        <div class="detail-block">
          <h2>Overview</h2>
          <p id="project-overview"></p>
        </div>

        <div class="detail-block">
          <h2>Technologies Used</h2>
          <ul id="project-tech" class="detail-list"></ul>
        </div>

        <div class="detail-block">
          <h2>Key Outcomes</h2>
          <ul id="project-outcomes" class="detail-list"></ul>
        </div>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
